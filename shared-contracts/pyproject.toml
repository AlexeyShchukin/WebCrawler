[project]
name = "crawler-contracts"
version = "0.1.0"
description = "Shared message contracts for the Web Crawler services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
