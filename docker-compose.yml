name: webcrawler

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - postgres_host
      - frontier_postgres
      - content_postgres

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rabbitmq

  rabbitmq-init:
    image: rabbitmq:4-management
    restart: "no"
    environment:
      RABBITMQADMIN_TARGET_HOST: rabbitmq
      RABBITMQADMIN_TARGET_PORT: "15672"
      RABBITMQADMIN_USERNAME: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQADMIN_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQADMIN_NON_INTERACTIVE_MODE: "true"
    volumes:
      - ./infrastructure/rabbitmq/bootstrap.sh:/usr/local/bin/rabbitmq-bootstrap:ro
      - ./infrastructure/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/rabbitmq-bootstrap"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - rabbitmq

  redis:
    image: redis:8-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - fetcher_redis

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - object_storage

  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-crawler-raw-content}
      RAW_CONTENT_RETENTION_DAYS: ${RAW_CONTENT_RETENTION_DAYS:-30}
    volumes:
      - ./infrastructure/minio/bootstrap.sh:/usr/local/bin/minio-bootstrap:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/minio-bootstrap"]
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - object_storage

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - content_elasticsearch

  api:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/api-service/Dockerfile
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      FRONTIER_INTERNAL_URL: http://frontier:8000
      CONTENT_INTERNAL_URL: http://content:8000
    depends_on:
      frontier:
        condition: service_started
      content:
        condition: service_started
    networks:
      - api_frontier
      - api_content

  frontier:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/frontier-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/frontier_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      MAX_FETCH_ATTEMPTS: ${MAX_FETCH_ATTEMPTS:-3}
      FETCH_LEASE_SECONDS: ${FETCH_LEASE_SECONDS:-120}
      MAX_URL_LENGTH: ${MAX_URL_LENGTH:-4096}
      LEASE_RECOVERY_POLL_INTERVAL_SECONDS: ${LEASE_RECOVERY_POLL_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    networks:
      - api_frontier
      - frontier_postgres
      - rabbitmq

  fetcher:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/fetcher-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-crawler-raw-content}
    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - rabbitmq
      - fetcher_redis
      - object_storage
      - fetcher_egress

  content:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/content-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/content_db
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/
      ELASTICSEARCH_URL: http://elasticsearch:9200
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-crawler-raw-content}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
    networks:
      - api_content
      - content_postgres
      - rabbitmq
      - object_storage
      - content_elasticsearch

networks:
  postgres_host:
  api_frontier:
    internal: true
  api_content:
    internal: true
  frontier_postgres:
    internal: true
  content_postgres:
    internal: true
  rabbitmq:
    internal: true
  object_storage:
    internal: true
  fetcher_redis:
    internal: true
  content_elasticsearch:
    internal: true
  fetcher_egress:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  elasticsearch_data:
