[project]
name = "crawler-frontier-service"
version = "0.1.0"
description = "URL queue, deduplication, and graph service for the Web Crawler."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5,<10",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "crawler-contracts>=0.1.0",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.uv.sources]
crawler-contracts = { path = "../../shared-contracts", editable = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crawler_frontier"
