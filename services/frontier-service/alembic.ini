[alembic]
script_location = alembic
prepend_sys_path = .
# The value is set by alembic/env.py. It uses DATABASE_URL when supplied,
# otherwise it reads local Compose credentials from the repository .env file.
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@127.0.0.1:5433/frontier_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
