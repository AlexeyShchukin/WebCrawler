[project]
name = "crawler-api-service"
version = "0.1.0"
description = "Public HTTP API for the Web Crawler."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14,<4",
    "crawler-contracts>=0.1.0",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.uv.sources]
crawler-contracts = { path = "../../shared-contracts", editable = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crawler_api"
