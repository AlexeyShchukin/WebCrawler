[project]
name = "crawler-content-service"
version = "0.1.0"
description = "HTML extraction, keyword processing, and search indexing service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.5,<10",
    "aioboto3>=15,<16",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "crawler-contracts>=0.1.0",
    "elasticsearch[async]>=8.17,<9",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "python-dotenv>=1.2,<2",
    "selectolax>=0.3,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.uv.sources]
crawler-contracts = { path = "../../shared-contracts", editable = true }

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crawler_content"

[tool.pytest.ini_options]
markers = [
    "unit: tests that do not require external services",
    "integration: tests that require isolated infrastructure",
    "e2e: tests that require the isolated acceptance stack",
]
addopts = "-m 'not integration and not e2e'"
